name: crawler-monitoring

# Opt-in stack. Never pass this file as an override to production compose.
services:
  crawler-prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    ports:
      - "127.0.0.1:${CRAWLER_PROMETHEUS_PORT:-9098}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - crawler-prometheus-data:/prometheus
    networks: [monitoring, crawler]
    mem_limit: 1g
    cpus: 1
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  crawler-pipeline:
    image: python:3.12.12-slim-bookworm
    restart: unless-stopped
    user: "${MONITOR_UID:?set a read-only IPC reader uid}:${MONITOR_GID:?set its gid}"
    command: [python, -B, /app/pipeline_exporter.py, --config, /app/monitoring.json]
    volumes:
      - ./pipeline_exporter.py:/app/pipeline_exporter.py:ro
      - ./runtime/monitoring.json:/app/monitoring.json:ro
      - /data/ipc:/data/ipc:ro
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  crawler-blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/config.yml]
    volumes:
      - ./blackbox.yml:/etc/blackbox/config.yml:ro
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging

volumes:
  crawler-prometheus-data:

networks:
  monitoring:
  crawler:
    external: true
    name: ${CRAWLER_DOCKER_NETWORK:?set existing Grafana Docker network name}
