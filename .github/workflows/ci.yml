name: Container tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, scheduler_ingest, crawler]
    defaults:
      run:
        working-directory: containers/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'
      - name: Install
        run: task install
      - name: Test
        run: task test
      - name: Test approved configuration
        if: matrix.service == 'scheduler_ingest'
        working-directory: .
        run: containers/scheduler_ingest/.venv/bin/python -m pytest -q tests/test_approved_control_sitemap_config.py

  golden_inject:
    name: golden_inject
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: golden_test
          POSTGRES_PASSWORD: golden_test
          POSTGRES_DB: golden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golden_test -d golden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOLDEN_INJECT_TEST_DSN: postgresql://golden_test:golden_test@127.0.0.1:5432/golden_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install injection test dependencies
        run: >-
          python -m pip install pytest==8.4.2 psycopg2-binary==2.9.11
          PyYAML==6.0.2 tldextract==5.1.1 sqlalchemy==2.0.44
      - name: Test injection, retries and real database recovery
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_golden_inject_commit_interval.py
          tests/test_golden_inject_srsltid_variant.py
          tests/test_golden_inject_batch.py
          tests/test_golden_inject_integration.py
          tests/test_cleanup_crawl_result.py
