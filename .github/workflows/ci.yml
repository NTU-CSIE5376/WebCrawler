name: Container API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        service: [api_gateway, scheduler_ingest]
    defaults:
      run:
        working-directory: containers/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'
      - name: Install
        run: task install
      - name: Test
        env:
          CRAWL_REQUEST_TEST_DSN: postgresql+psycopg2://crawler:crawler@127.0.0.1:5432/crawler_test
        run: task test
