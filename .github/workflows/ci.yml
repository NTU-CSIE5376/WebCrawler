name: Container tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, scheduler_ingest, crawler]
    defaults:
      run:
        working-directory: containers/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'
      - name: Install
        run: task install
      - name: Test
        run: task test
