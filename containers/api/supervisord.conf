[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
directory=/app
command=python -m containers.api.server --config "%(ENV_API_CONFIG_PATH)s"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:manual_bulk_crawl_gc]
directory=/app
command=python -m containers.api.manual_bulk_crawl_gc --config "%(ENV_API_CONFIG_PATH)s"
numprocs=1
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
