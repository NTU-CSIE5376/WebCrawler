router:
  progress_template: "/data/ipc/progress/router/{id:02d}.json"
  crawler_dir_template: "/data/ipc/crawl_result/crawler_{id:02d}"
  ingestor_dir_template: "/data/ipc/crawl_result/ingestor_{id:02d}"
  stats_dir: "/data/ipc/stats"
  interval_minutes: 10
  # Immutable typed discovery/content Parquet output.
  output_batch_records: 16384
  output_max_buffer_mib: 64
  output_flush_seconds: 1.0

  num_shards: 256
  shards_per_ingestor: 16

  # Pin top-traffic domains 32 apart so each lands on a distinct ingestor.
  # eTLD+1 overrides are also the fallback shard for non-whitelisted
  # subdomains (whitelist lives in DB table shard_split_subdomain).
  domain_overrides:
    wikipedia.org: 0
    x.com: 32
    youtube.com: 64
    reddit.com: 96
    instagram.com: 128
    espn.com: 160
    facebook.com: 192
    yahoo.com: 224

ingestion:
  # Seed split checkpoints once and retain the safe legacy cleanup watermark.
  legacy_progress_template: "/data/ipc/progress/ingestor/{id:02d}.json"

# Both components read the existing destination-sharded stream. Independent
# checkpoints separate discovery backlog from fetched-result ingestion.
discovery_ingestor:
  distinct_urls_per_shard: 64000
  max_buffer_mib: 2048
  idle_flush_seconds: 600
  max_buffer_age_seconds: 600
  poll_seconds: 1
  lock_dir: "/data/ipc/locks/ingestion"
  progress_template: "/data/ipc/progress/discovery_ingestor/{id:02d}.json"
  result_dir_template: "/data/ipc/crawl_result/ingestor_{id:02d}"
  stats_dir: "/data/ipc/stats"
  interval_minutes: 10

content_ingestor:
  max_buffer_mib: 64
  poll_seconds: 1
  lock_dir: "/data/ipc/locks/ingestion"
  progress_template: "/data/ipc/progress/content_ingestor/{id:02d}.json"
  result_dir_template: "/data/ipc/crawl_result/ingestor_{id:02d}"
  stats_dir: "/data/ipc/stats"
  interval_minutes: 10

# Discovery policy audit output; audit_batch_size: 1 restores per-entry writes.
trap_filter:
  audit_batch_size: 4096
  audit_max_buffer_bytes: 1048576
  audit_flush_interval_seconds: 1.0

extractor:
  progress_template: "/data/ipc/progress/extractor/{id:02d}.json"
  result_dir_template: "/data/ipc/crawl_result/ingestor_{id:02d}"
  stats_dir: "/data/ipc/stats"
  interval_minutes: 10

stats:
  stats_dir: "/data/ipc/stats"
  bad_dir: "/data/ipc/stats/bad"

postgres:
  dsn: "postgresql+psycopg2://yugabyte:yugabyte@172.16.191.3:5433/crawlerdb"

golden_discovery_ranker_v1:
  # Optional inline scoring for newly discovered URLs. Keep disabled until the
  # artifact is mounted in scheduler_ingest; the background ranker can still
  # score rows later when this is false.
  ingest_inline_enabled: false
  artifact_path: "/app/artifacts/golden_discovery_ranker_v1.joblib"
  ingest_inline_score_timeout_sec: 30.0
  ingest_inline_score_batch_size: 5000
