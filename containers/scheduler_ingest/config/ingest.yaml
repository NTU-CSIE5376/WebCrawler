router:
  progress_template: "/data/ipc/progress/router/{id:02d}.json"
  crawler_dir_template: "/data/ipc/crawl_result/crawler_{id:02d}"
  ingestor_dir_template: "/data/ipc/crawl_result/ingestor_{id:02d}"
  stats_dir: "/data/ipc/stats"
  interval_minutes: 10

  num_shards: 256
  shards_per_ingestor: 16

  # Pin top-traffic domains 32 apart so each lands on a distinct ingestor.
  # eTLD+1 overrides are also the fallback shard for non-whitelisted
  # subdomains (whitelist lives in DB table shard_split_subdomain).
  domain_overrides:
    wikipedia.org: 0
    x.com: 32
    youtube.com: 64
    reddit.com: 96
    instagram.com: 128
    espn.com: 160
    facebook.com: 192
    yahoo.com: 224

ingestor:
  progress_template: "/data/ipc/progress/ingestor/{id:02d}.json"
  result_dir_template: "/data/ipc/crawl_result/ingestor_{id:02d}"
  stats_dir: "/data/ipc/stats"
  interval_minutes: 10

# Newly discovered links only (crawl results are untouched).
#   normalize_params: stripped for real (libs/frontier/url_normalize.py).
#   shadow_normalize: log what stripping every tracking / session param would
#     change (action "would_normalize"), without applying it.
#   drop: discard links hitting a high-confidence trap rule
#     (libs/frontier/trap_rules.py HIGH_CONFIDENCE).
# Every affected link goes to a daily gzip JSONL audit log;
# scripts/trap_filter_golden_check.py measures golden false kills. Rules and
# validation: docs/09-frontier-trap-rules.md.
trap_filter:
  enabled: true
  normalize: true
  normalize_params: [srsltid, jsessionid, phpsessid]
  shadow_normalize: true
  drop: true
  log_dir_template: "/data/ipc/trap_filter/ingestor_{id:02d}"

extractor:
  progress_template: "/data/ipc/progress/extractor/{id:02d}.json"
  result_dir_template: "/data/ipc/crawl_result/ingestor_{id:02d}"
  stats_dir: "/data/ipc/stats"
  interval_minutes: 10

stats:
  stats_dir: "/data/ipc/stats"
  bad_dir: "/data/ipc/stats/bad"

postgres:
  dsn: "postgresql+psycopg2://yugabyte:yugabyte@172.16.191.3:5433/crawlerdb"

golden_discovery_ranker_v1:
  # Optional inline scoring for newly discovered URLs. Keep disabled until the
  # artifact is mounted in scheduler_ingest; the background ranker can still
  # score rows later when this is false.
  ingest_inline_enabled: false
  artifact_path: "/app/artifacts/golden_discovery_ranker_v1.joblib"
  ingest_inline_score_timeout_sec: 10.0
  ingest_inline_score_batch_size: 5000
