server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Docker DNS; resolve at request time so backend restarts/IP changes work.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;

    location = /scheduler_ingest {
        return 308 /scheduler_ingest/$is_args$args;
    }

    location /scheduler_ingest/ {
        set $backend scheduler_ingest:8080;
        rewrite ^/scheduler_ingest/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_read_timeout 150s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /scheduler_ingest;
        # Submissions are not idempotent; do not retry on another upstream.
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}
