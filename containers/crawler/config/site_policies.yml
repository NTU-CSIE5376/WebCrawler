# Domain rules apply to the registered domain and all its subdomains.
# Loaded from config/site_policies.yml in the crawler's working directory.
# Exact hostname rules override domain rules, one header at a time.
# A null header suppresses it, including headers from DEFAULT_REQUEST_HEADERS.
# middleware names the Python class to handle matching requests.
# Exact host rules inherit the domain middleware; null disables it for that host.
# Additional options: headers and download_timeout_sec (positive seconds).
# crawler_mode and request_limits inherit default -> domain -> exact host.
# Scrapy delay is calculated as 1 / max_qps; AutoThrottle may slow down further.
default:
  crawler_mode: autothrottle
  request_limits:
    max_qps: 4
    max_concurrent_requests: 16

domains:
  wikipedia.org:
    crawler_mode: autothrottle
    middleware: crawler.middlewares.wikipedia.WikipediaMiddleware
    request_limits:
      download_slot: wikipedia
      max_concurrent_requests: 10 # Per crawler process; no shared request budget.
      max_qps: 15 # ref: https://wikitech.wikimedia.org/wiki/Robot_policy
    headers:
      User-Agent: "WebCrawlerBot/1.0 (+https://github.com/NTU-CSIE5376/WebCrawler)"
      Sec-Fetch-Dest: null
      Sec-Fetch-Mode: null
      Sec-Fetch-Site: null
      Sec-Fetch-User: null
      Upgrade-Insecure-Requests: null

  youtube.com:
    middleware: crawler.middlewares.youtube.YouTubeMiddleware

