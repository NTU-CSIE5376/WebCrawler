[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[program:crawler_default]
; CRAWLER_PARSER_PROCESSES is inherited from the container environment.
directory=/app/containers/crawler
process_name=crawler_%(process_num)02d
command=scrapy crawl html_spider -a crawler_id=%(process_num)d --loglevel WARNING
numprocs=15
numprocs_start=0
environment=PYTHONPATH="/app",
            CRAWLER_CONCURRENT_REQUESTS="256",
            CRAWLER_AUTOTHROTTLE_START_DELAY="0.5",
            CRAWLER_AUTOTHROTTLE_MAX_DELAY="10.0",
            CRAWLER_AUTOTHROTTLE_TARGET_CONCURRENCY="4.0",
            CRAWLER_AUTOTHROTTLE_DEBUG="false"
autostart=true
autorestart=true
startretries=20
stopsignal=TERM
stopwaitsecs=60
; Let Scrapy drain and join its parser children before the group KILL fallback.
killasgroup=true
stopasgroup=false
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:crawler_canary]
; Use the same inherited parser setting as the baseline workers.
directory=/app/containers/crawler
process_name=crawler_15
command=scrapy crawl html_spider -a crawler_id=15 --loglevel WARNING
numprocs=1
environment=PYTHONPATH="/app",
            CRAWLER_CONCURRENT_REQUESTS="384",
            CRAWLER_SCRAPER_SLOT_MAX_ACTIVE_SIZE="150000000",
            CRAWLER_AUTOTHROTTLE_START_DELAY="0.5",
            CRAWLER_AUTOTHROTTLE_MAX_DELAY="10.0",
            CRAWLER_AUTOTHROTTLE_TARGET_CONCURRENCY="4.0",
            CRAWLER_AUTOTHROTTLE_DEBUG="false"
autostart=true
autorestart=true
startretries=20
stopsignal=TERM
stopwaitsecs=60
; Include parser children if graceful shutdown exceeds the timeout.
killasgroup=true
stopasgroup=false
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[group:crawler]
programs=crawler_default,crawler_canary
