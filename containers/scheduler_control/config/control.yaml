offerer:
  # Offerer IDs to run (inclusive)
  id_start: 0
  id_end: 15

  # Disk path
  # The crawler id equals offerer id by default in this mapping.
  queue_dir_template: "/data/ipc/url_queue/crawler_{id:02d}"
  stats_dir: "/data/ipc/stats"

  # Shard assignment rule
  total_shards: 256
  shards_per_offerer: 16

  # Refill policy (per-domain)
  scan_interval_sec: 60
  max_domain_files: 200
  low_watermark_domains: 120
  per_domain_url_cap: 100


postgres:
  dsn: "postgresql+psycopg2://crawler:crawler@172.16.191.1:5432/crawlerdb"

gc:
  total_shards: 256

  # Frontier budget. Freeze a domain (stop inserting its newly discovered
  # links) once it holds more than frontier_cap pending URLs AND its lifetime
  # fetch-success rate is below yield_floor. Tuned from production: trap
  # domains sit at <0.1% yield with tens of millions pending, healthy domains
  # clear ~2%+, so a 1% floor separates them with margin.
  frontier_cap: 1000000
  yield_floor: 0.01
  sample_percent: 0.5

  # Eviction. should_crawl=TRUE means never scheduled (so never fetched); a
  # URL the offerer has had this many days to schedule and never did is dead
  # frontier weight. Frozen-domain frontier drains faster.
  stale_pending_days: 60
  frozen_pending_days: 7
  batch_size: 5000

  # Daily UTC schedule, offset from accounting (03:00) to avoid overlap.
  run_hour_utc: 4
  run_minute_utc: 0
  check_interval_sec: 3600
  catch_up_on_start: true

accounting:
  total_shards: 256
  event_retention_days: 90
  batch_size: 1000

  # Same daily pass drops partitions of the append-only *_history tables (no
  # pipeline read path) older than this. 0 disables. The 90-day rolling counters
  # live in the current table and are unaffected. Requires the tables to be
  # partitioned first (scripts/migrate_partition_history.py); un-migrated tables
  # are skipped.
  history_retention_days: 30

  # Daily UTC schedule for rolling out aged counters.
  run_hour_utc: 3
  run_minute_utc: 0

  # Polling cadence for schedule check.
  check_interval_sec: 3600

  # If the service starts after today's schedule, run immediately once.
  catch_up_on_start: true

golden_discovery_ranker_v1:
  # Disabled by default so the production image can be reviewed/deployed before
  # the ranker artifact is mounted. Enable with GOLDEN_DISCOVERY_RANKER_V1_ENABLED=true.
  enabled: false
  artifact_path: "/app/artifacts/golden_discovery_ranker_v1.joblib"
  # model_kind: "v1" (default, legacy SGD 4-head) or "v2" (prefetch hybrid:
  # per-domain LightGBM + general head). For v2, point artifact_path at the v2
  # joblib and (optionally) set v1_fallback_artifact so domains the hybrid does
  # not cover fall back to v1 instead of the v2 general head. Override per-env
  # with GOLDEN_DISCOVERY_RANKER_V1_MODEL_KIND=v2 /
  # GOLDEN_DISCOVERY_RANKER_V1_V1_FALLBACK_ARTIFACT=/app/artifacts/...v1.joblib
  model_kind: "v1"
  v1_fallback_artifact: ""
  total_shards: 256
  # 32 single-threaded workers (see supervisord numprocs). Sized so one full
  # pass over the ~787M steering-eligible URLs finishes inside rescore_ttl_days:
  # 16 workers measured ~150M/day (pass ~5.2 days); 32 ~doubles throughput
  # (pass ~2.6 days), leaving headroom under the 5-day TTL even if SKIP-LOCKED
  # write contention makes scaling sublinear.
  num_workers: 32
  batch_size: 1000
  scan_interval_sec: 60
  max_batches_per_shard: 4
  # Domain-priority steering: when on, the scorer only picks unscored URLs
  # whose domain has `domain_state.domain_score > 0` (i.e. golden-tagged),
  # ordered domain_score DESC then first_seen ASC. When off, the scorer
  # falls back to the legacy first_seen-ASC pool across all domains. Default
  # off; flip on after `domain_state.domain_score` has been populated via the
  # tier-write cron. Override per-env with
  # GOLDEN_DISCOVERY_RANKER_V1_DOMAIN_PRIORITY_STEERING_ENABLED=true.
  domain_priority_steering_enabled: false
  # v2 continuous re-scoring (only takes effect on the steering path). The v2
  # ranker's features (inlink_count_*, anchor_text) drift over time, so url_score
  # is no longer write-once.
  #   rescore_ttl_days: re-pick a URL once its score is older than this many days
  #     (plus all never-scored rows). Must be >= one-full-pass time or scores
  #     fall behind. At 32 workers one pass over the ~787M steering-eligible URLs
  #     is ~2.6 days, so 5 leaves ~1.9x headroom. If you drop back to 16 workers,
  #     raise this to >= ~10 (pass becomes ~5.2 days).
  #     Override with GOLDEN_DISCOVERY_RANKER_V1_RESCORE_TTL_DAYS. 0 = write-once.
  #   min_age_days: don't score a URL until it has aged this long in the DB, so
  #     its inlinks/anchors settle first; it keeps the v1 inline score until then.
  #     Override with GOLDEN_DISCOVERY_RANKER_V1_MIN_AGE_DAYS. 0 = no gate.
  rescore_ttl_days: 5
  min_age_days: 3


golden_parent_patrol:
  # Cron-driven (not a supervisord service); see docs/08-golden-parent-patrol.md
  # for the runbook. Disabled by default so the migration + backfill can land
  # before any production write happens. Enable with
  # GOLDEN_PARENT_PATROL_ENABLED=true after backfill is in place.
  enabled: false

  # Constant url_score written when the cron flips should_crawl=TRUE on a
  # patrol parent. 1.0 puts patrol parents at the top of the offerer's
  # ranked candidates without competing against ranker scores numerically.
  patrol_priority: 1.0

  # next_patrol_at = now() + cadence_buckets[<bucket>] seconds.
  # Adding or renaming a bucket requires updating libs.patrol.cadence
  # BUCKET_ORDER as well. The `fast` (1 h) bucket was dropped in design
  # review to avoid hammering anti-bot WAFs on productive parent pages.
  cadence_buckets:
    medium:  21600      # 6h  (fastest cadence)
    slow:    86400      # 1d
    trial:   172800     # 2d
    cold:    345600     # 4d (kept under v2 scorer's 5d TTL — see docs/08 §D1)

  # Short-loop transitions:
  #   new URL count >= promote_threshold        -> promote one bucket
  #   no new URL on `demote_threshold` cycles   -> demote one bucket
  bucket_transitions:
    promote_threshold: 5
    demote_threshold:  2

  # Long-loop transitions on each new metric_batches row:
  #   1st consecutive miss -> demote one bucket
  #   2nd consecutive miss -> retire (status='retired')
  retire_policy:
    consecutive_miss_batches_demote: 1
    consecutive_miss_batches_retire: 2

  # When the crawler hasn't fetched the parent since the last cron mark,
  # we re-confirm should_crawl=TRUE without transitioning cadence and
  # push next_patrol_at out by this much. Avoids penalising parents whose
  # politeness window is still active.
  grace_period_seconds: 900       # 15m

  # Max due rows processed per cron invocation. With 10-minute cron and
  # patrol_state on the order of a few thousand rows, 1000 leaves plenty
  # of headroom and bounds the per-run wall time.
  cron_batch_size: 1000

  # Long-loop window: each metric_batch is evaluated against parents that
  # first-discovered URLs in the cycle ending at the batch's created_at.
  # Bi-weekly = 14 days; change this and the long-loop becomes mis-aligned
  # with metric_batches cadence.
  cycle_days: 14
